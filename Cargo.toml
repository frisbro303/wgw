[package]
name = "wgw"
version = "0.1.0"
edition = "2021"
description = "Interactive meshes, points, curves and vector fields in WebGL2, driven by widgets in Python, JS or anything that returns arrays."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }
js-sys = "0.3"
glow = "0.16"
wgw-scene = { path = "scene" }
wgw-render = { path = "render" }
glam = "0.30"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
