# Build wgw and its docs (Typst pages, built by tdg) on every push to main, and publish them to GitHub Pages.
# (Pages must be set to deploy from GitHub Actions: Settings > Pages > Source.)
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
      - run: cargo install wasm-pack --locked
      - run: ./build.sh
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0
      - run: pip install "tdg @ git+https://github.com/frisbro303/tdg" "pagefind[bin]"
      - run: tdg build docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
