# Build wgw and its docs (a tdg site, built by Typst) on every push to main, and publish them to GitHub Pages.
# (Pages must be set to deploy from GitHub Actions: Settings > Pages > Source.)
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test
      - run: cargo install wasm-pack --locked
      - run: ./build.sh
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0
      - name: Install tdg (github.com/frisbro303/tdg) as @local/tdg
        run: |
          git clone --depth 1 https://github.com/frisbro303/tdg /tmp/tdg
          mkdir -p ~/.local/share/typst/packages/local/tdg
          cp -R /tmp/tdg/typst ~/.local/share/typst/packages/local/tdg/0.2.0
      - run: typst compile --root . --features html,bundle --format bundle docs/site.typ docs/_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
