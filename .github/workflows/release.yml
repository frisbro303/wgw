# On a version tag (v0.1.0): build wgw-window for each platform, so the heads' users needn't build it, and attach
# them to the tag's GitHub release. wgw-window carries dist/, which one job builds for all.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen (the version in Cargo.lock) and wasm-opt
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C /tmp
          echo /tmp/binaryen-version_133/bin >> "$GITHUB_PATH"
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  window:
    needs: dist
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: wgw-window-linux-x86_64, features: "" }
          - { os: ubuntu-latest, name: wgw-window-linux-x86_64-headless, features: "--no-default-features" }
          - { os: macos-latest, name: wgw-window-macos-arm64, features: "" }
          - { os: windows-latest, name: wgw-window-windows-x86_64.exe, features: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: GTK's WebKit, for windows on Linux
        if: runner.os == 'Linux' && matrix.features == ''
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo build --release -p wgw-window ${{ matrix.features }}
      - name: Name it
        shell: bash
        run: cp "target/release/wgw-window$([ "$RUNNER_OS" = Windows ] && echo .exe)" "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}
