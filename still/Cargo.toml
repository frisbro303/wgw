[package]
name = "wgw-still"
version.workspace = true
edition.workspace = true
description = "wgw figures as images without a browser: a figure's scene drawn by wgw-render on a CPU GL, with the same shaders as the page"

[lib]
crate-type = ["rlib"]

[dependencies]
wgw-scene.workspace = true
wgw-render.workspace = true
naga = { workspace = true, features = ["wgsl-in"] }
png = "0.17"
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
