[package]
name = "wgw-still"
version = "0.1.0"
edition = "2021"
description = "wgw figures as images without a browser: a figure's scene drawn by wgw-render on a CPU GL, with the same shaders as the page"

[lib]
crate-type = ["rlib"]

[dependencies]
wgw-scene = { path = "../scene" }
wgw-render = { path = "../render" }
naga = { version = "26", features = ["wgsl-in"] }
png = "0.17"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
