[package]
name = "wgw-scene"
version = "0.2.0"
edition = "2021"
description = "wgw's scene, without a renderer: arrays, layers, mesh files, the camera, framing, colors and lighting. Shared by the WebGL viewer and the SVG stills."

[dependencies]
glam = "0.30"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
