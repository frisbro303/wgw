<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wgw examples</title>
<style>
  :root { --wgw-colors: #dad8ce, #af3029; --wgw-edge: rgba(16, 15, 15, 0.25); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --wgw-colors: #403e3c, #d14d41; --wgw-edge: rgba(255, 255, 255, 0.15); } }
  body { max-width: 720px; margin: 40px auto; padding: 0 16px; font: 17px/1.5 Georgia, serif; }
  .wgw { margin: 16px 0 40px; }
  #curvature { --wgw-colors: #4385be, #dad8ce, #af3029; }
</style>
<script type="module" src="../dist/wgw.js"></script>
</head>
<body>
<h1>wgw</h1>
<p>Drag to turn, pinch or ctrl+scroll to zoom, double-click to reset. Build the torus widget first:
<code>cargo wgw -p torus</code>, which writes examples/torus.wgw.</p>

<h2>A widget: a torus colored by its curvature, reshaped by sliders</h2>
<div class="wgw" id="curvature" data-src="torus.wgw" data-view="-60,35"></div>

<h2>A mesh file</h2>
<div class="wgw" data-src="spot.wgw" data-up="y" data-view="-110,15"></div>
</body>
</html>
