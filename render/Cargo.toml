[package]
name = "wgw-render"
version.workspace = true
edition.workspace = true
description = "wgw's renderer: scenes of layers drawn through a small GL trait with wgw's WGSL shaders, by WebGL on a page or on the CPU for stills."

[dependencies]
wgw-scene.workspace = true
glam.workspace = true
bytemuck.workspace = true

[build-dependencies]
# Translates the WGSL shaders to GLSL for WebGL (build.rs).
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
